        contactPhone: { type: string, default: '' }
        assignedFleetCount: { type: integer, format: int32, minimum: 0 }
        operatingHours: { type: string, default: '' }
        serviceLevel: { type: string, default: '' }
        minimumLeadTimeHours: { type: integer, format: int32, minimum: 0 }
        cancellationPolicyReference: { type: string, default: '' }
        membershipEligibility: { type: string, default: '' }
        vipOverrideRule: { type: string, default: '' }
        isActive: { type: boolean, default: true }
    PatchPropertyRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string }
        contactPerson: { type: string }
        contactPhone: { type: string }
        assignedFleetCount: { type: integer, format: int32, minimum: 0 }
        operatingHours: { type: string }
        serviceLevel: { type: string }
        minimumLeadTimeHours: { type: integer, format: int32, minimum: 0 }
        cancellationPolicyReference: { type: string }
        membershipEligibility: { type: string }
        vipOverrideRule: { type: string }
        isActive: { type: boolean }
    CancellationReasonView:
