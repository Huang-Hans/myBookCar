# Delivery contract snapshot. Runtime query/header metadata is generated from the actual request contracts.
# Refresh published parameter metadata from generated OpenAPI; do not maintain a separate parameter provider.
openapi: 3.0.3
info:
  title: LMS Portal Management API (S1 + S2)
  version: 1.0.0
  description: >-
    Business operations of Portal stages S1 (read-only configuration, CF03-CF12, CF14-CF21) and
    S2 (identity-backed master data and audit, US01-US04, CF01-CF02, CF22, DR01-DR04, LC01-LC05,
    BL01-BL04, AU01). Paths, DTOs and codes follow docs/design/LMS-spec-20261008-05-api-contract.md; application codes
    are registered in docs/api/error-codes.md. Every response, success or failure, uses the unified
    envelope and carries traceId (body and X-Trace-Id header). Business routes require a Bearer token
    from the corporate identity provider; the caller's role, permissions and property scope come from
    the persisted portal user, never from request headers. While Identity:Authority is not configured
    every operation answers 401 / 40100.
    Configuration operations (CF) answer 503 / 50300 when the approved configuration body is not
    available (no environment configured, no active release, no body for the area, or an unreadable
    body); they never return demonstration data. A repeated POST with the same Idempotency-Key and
    identical content answers 201 with the resource's current state (contract question Q09 is open:
    it is not a byte-for-byte replay of the first response). Null ordering of nullable sort columns
    follows MongoDB's default and is not normalised to "last" for database-backed lists.
servers:
  - url: http://localhost:5088
    description: API gateway (Development)
tags:
  - name: Users
  - name: Drivers
  - name: Locations
  - name: CustomerBlacklists
  - name: AuditRecords
  - name: Configuration
security:
  - bearerAuth: []
paths:
  /api/platform/staff/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: US01 List portal users (permission users:read)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, required: false, description: 'Comma separated; leading - is descending. Allowed: name, corporateEmail, roleCode, propertyId, identityProvider, isActive, userId. Default name,userId.', schema: { type: string } }
        - { name: propertyId, in: query, required: false, description: 'Explicit property filter; outside the caller scope answers 403.', schema: { type: string } }
        - { name: isActive, in: query, required: false, schema: { type: boolean } }
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PortalUserView' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Users]
      operationId: createUser
      summary: US03 Create a portal user (permission users:write)
      description: Registers local authorization only; no identity-provider account is created and subjectId stays unset (the user cannot sign in until linked).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePortalUserRequest' } } } }
      responses:
        '201': { description: Created (also returned for a matching idempotent retry), headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/PortalUserView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/platform/staff/v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Users]
      operationId: getUser
      summary: US02 Read a portal user (permission users:read)
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/PortalUserView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: US04 Edit or deactivate a portal user (permission users:write)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchPortalUserRequest' } } } }
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/PortalUserView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/dispatch/staff/v1/drivers:
    get:
      tags: [Drivers]
      operationId: listDrivers
      summary: DR01 List drivers (permission drivers:read; served by Dispatch)
      # 交付快照；运行时参数文档由 DriverListRequest 和 PagedQueryRequest 生成。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, required: false, description: '可用字段：name、driverId、licenseNumber、phone、propertyId、assignedVehicle、availability、status。默认排序为 name,driverId。', schema: { type: string, nullable: true, default: 'name,driverId' } }
        - { name: propertyId, in: query, required: false, description: '按物业筛选；传入时不能为空白。', schema: { type: string, nullable: true } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/DriverStatus' } }
        - { name: view, in: query, required: false, description: '页面标签筛选，与其他条件取交集；默认 ALL，BLACKLIST 包含停用与暂停的司机。', schema: { type: string, enum: [ALL, AVAILABLE, ON_TRIP, BLACKLIST], default: ALL } }
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/DriverView' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Drivers]
      operationId: createDriver
      summary: DR03 Create a driver (permission drivers:write)
      description: availability, availabilitySource and syncedAt are read-only and stay unset until a trusted synchronisation source exists.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDriverRequest' } } } }
      responses:
        '201': { description: Created (also returned for a matching idempotent retry), headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/DriverView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/dispatch/staff/v1/drivers/{driverId}:
    parameters:
      - { name: driverId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Drivers]
      operationId: getDriver
      summary: DR02 Read a driver (permission drivers:read)
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/DriverView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Drivers]
      operationId: updateDriver
      summary: DR04 Edit or deactivate a driver (permission drivers:write)
      description: Only status=INACTIVE expresses deactivation; it records a restriction dated on the business day (Asia/Macau by default) and keeps the record.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchDriverRequest' } } } }
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/DriverView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Drivers]
      operationId: removeDriver
      summary: DR05 Delete a driver (permission drivers:write)
      description: Soft-deletes the driver and disables login, retaining historical shifts and audit records. Drivers on a trip cannot be deleted. Missing or out-of-scope drivers return 404. No request body.
      responses:
        '200': { description: Removed, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: object, nullable: true, example: null } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/platform/staff/v1/locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: LC01 List common locations (permission locations:read)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, required: false, description: 'Allowed: name, region, categoryCode, address, coordinates.latitude, coordinates.longitude, contactPerson, contactPhone, operatingHours, geofence.isEnabled, isActive, sortOrder, locationId. Default region,sortOrder,locationId.', schema: { type: string } }
        - { name: isActive, in: query, required: false, schema: { type: boolean } }
        - { name: region, in: query, required: false, schema: { $ref: '#/components/schemas/LocationRegion' } }
        - { name: categoryCode, in: query, required: false, description: 'Exact category code from the uploaded location categories (e.g. LC-001). A different dimension from region; neither replaces the other.', schema: { type: string } }
        - { name: locationIds, in: query, required: false, description: 'Comma-separated location ids (the first 100 are used, at most 2000 characters). Restricts the page to those locations, so favourites and recents can be resolved to names and active state without paging the whole catalog.', schema: { type: string } }
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/LocationView' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Locations]
      operationId: createLocation
      summary: LC03 Create a common location (permission locations:write)
      description: The location is appended to the end of its region. categoryCode must be an uploaded category code.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateLocationRequest' } } } }
      responses:
        '201': { description: Created (also returned for a matching idempotent retry), headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/LocationView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/platform/staff/v1/locations/{locationId}:
    parameters:
      - { name: locationId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Locations]
      operationId: getLocation
      summary: LC02 Read a common location (permission locations:read)
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/LocationView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Locations]
      operationId: updateLocation
      summary: LC04 Edit or deactivate a common location (permission locations:write)
      description: Changing the region moves the location to the end of the new region.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchLocationRequest' } } } }
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/LocationView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/platform/staff/v1/location-orderings/{region}:
    put:
      tags: [Locations]
      operationId: replaceLocationOrdering
      summary: LC05 Replace the location order of one region (permission locations:write)
      description: >-
        items must contain every location of the region exactly once, each exactly once; list order is the new display order.
        A member set that differs from the stored region answers 400 / 40001.
      parameters:
        - { name: region, in: path, required: true, schema: { $ref: '#/components/schemas/LocationRegion' } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationOrderingRequest' } } } }
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/LocationOrderingView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/platform/staff/v1/customer-blacklists:
    get:
      tags: [CustomerBlacklists]
      operationId: listCustomerBlacklists
      summary: BL01 List customer restrictions (permission blacklists:read)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, required: false, description: 'Allowed: customerName, memberId, reason, effectiveDate, expiryDate, isActive, blacklistId. Default customerName,blacklistId.', schema: { type: string } }
        - { name: isActive, in: query, required: false, description: 'Record status, not date validity.', schema: { type: boolean } }
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CustomerBlacklistView' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [CustomerBlacklists]
      operationId: createCustomerBlacklist
      summary: BL03 Create a customer restriction (permission blacklists:write)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCustomerBlacklistRequest' } } } }
      responses:
        '201': { description: Created (also returned for a matching idempotent retry), headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/CustomerBlacklistView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/platform/staff/v1/customer-blacklists/{blacklistId}:
    parameters:
      - { name: blacklistId, in: path, required: true, schema: { type: string } }
    get:
      tags: [CustomerBlacklists]
      operationId: getCustomerBlacklist
      summary: BL02 Read a customer restriction (permission blacklists:read)
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/CustomerBlacklistView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [CustomerBlacklists]
      operationId: updateCustomerBlacklist
      summary: BL04 Edit or deactivate a customer restriction (permission blacklists:write)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchCustomerBlacklistRequest' } } } }
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/CustomerBlacklistView' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/platform/staff/v1/audit-records:
    get:
      tags: [AuditRecords]
      operationId: listAuditRecords
      summary: AU01 Query Platform administration audit (permission audit:read)
      description: >-
        Covers the audit records owned by Platform only (user, location and restriction changes); records
        owned by other services are not included until cross-owner retrieval is decided (Q11). Callers
        without all-property access only see records that carry their own propertyId.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - { name: sort, in: query, required: false, description: 'Allowed: occurredAt, actor, operation, resourceType, propertyId, device, sourceIp, sessionReference, outcome, auditId. Default -occurredAt,auditId.', schema: { type: string } }
        - { name: propertyId, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, description: 'Inclusive lower bound (ISO 8601 UTC, ends with Z).', schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, description: Exclusive upper bound; must be later than from., schema: { type: string, format: date-time } }
      responses:
        '200': { description: Success, headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/AuditView' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } ] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/platform/staff/v1/properties:
    get:
      tags: [Configuration]
      operationId: listProperties
      summary: CF01 List uploaded properties (permission configuration:read)
      description: Limited to the caller's property scope. dailyQuota is supplied by Booking's authoritative quota and is omitted until Booking provides it.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - { name: status, in: query, required: false, description: 'Property status; omit for all including deleted records.', schema: { type: string, enum: [Active, Inactive, Deleted] } }
