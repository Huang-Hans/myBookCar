  parameters:
    Page: { name: page, in: query, required: false, description: 'Page number, >= 1. Default 1.', schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, required: false, description: 'Page size. Default 10.', schema: { type: integer, enum: [10, 20, 50], default: 10 } }
    Search: { name: search, in: query, required: false, description: 'Case-insensitive contains match on the visible columns; blank means no filter.', schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, description: 'Non-blank key; the same key with different content answers 409 / 40900.', schema: { type: string } }
    ExpectedVersion: { name: X-Expected-Version, in: header, required: true, description: 'Current resource version for optimistic concurrency.', schema: { type: integer, format: int64, minimum: 1 } }
  responses:
    BadRequest:
      description: 'Malformed request (40000: bad JSON, missing/invalid Idempotency-Key, unexpected body) or validation failed (40001: unknown field or query parameter, invalid value, merged resource violates a field rule).'
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: 'Not authenticated (40100) or token expired (40101).'
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: 'Insufficient permission (40300): missing permission, token subject not linked to an active portal user, explicit property outside the caller scope, or a grant beyond the caller scope.'
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: 'Resource not found (40400), or not visible to the caller.'
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: 'State conflict (40900): duplicate unique value, or idempotency key reused with different content.'
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    BusinessRuleRejected:
      description: 'Business rule rejected (42200): the property has business references and cannot be deleted. The propertyId issue explains the restriction.'
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    InternalError:
      description: 'Internal server error (50000).'
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: 'Service unavailable (50300): the approved configuration body, the uploaded property list, the authorization source, or a required property reference service is not available.'
      headers: { X-Trace-Id: { $ref: '#/components/headers/TraceId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    SuccessEnvelope:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: integer, example: 20000 }
        message: { type: string, example: success }
        data: { nullable: true }
        meta: { $ref: '#/components/schemas/PageMeta' }
        traceId: { type: string, example: 4bf92f3577b34da6a3ce929d0e0e4736 }
    PageMeta:
      type: object
      required: [traceId]
      properties:
        traceId: { type: string }
        pagination: { $ref: '#/components/schemas/Pagination' }
    Pagination:
      type: object
      required: [currentPage, pageSize, totalItems, totalPages]
      properties:
        currentPage: { type: integer, example: 1 }
        pageSize: { type: integer, example: 10 }
        totalItems: { type: integer, example: 156 }
        totalPages: { type: integer, example: 16 }
    ApiFieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: emailAddress }
        message: { type: string, example: Invalid email format }
        code: { type: string, nullable: true }
    ErrorEnvelope:
      type: object
      required: [code, message, errors, traceId]
      properties:
        code: { type: integer, example: 40001 }
        message: { type: string, example: Validation failed }
        errors: { type: array, items: { $ref: '#/components/schemas/ApiFieldError' } }
        traceId: { type: string, example: 4bf92f3577b34da6a3ce929d0e0e4736 }
    RoleCode: { type: string, enum: [SUPER_ADMIN, OPERATIONS_MANAGER, DISPATCHER, FINANCE, PROPERTY_CS_STAFF] }
    LocationRegion: { type: string, enum: [MACAU_PENINSULA, COTAI, HONG_KONG, AIRPORT] }
    DriverStatus: { type: string, enum: [ACTIVE, INACTIVE, SUSPENDED] }
    DriverAvailability: { type: string, enum: [AVAILABLE, ON_TRIP, OFF_DUTY, BREAK] }
    NotificationEventType: { type: string, enum: [BOOKING_CONFIRMATION, TRIP_REMINDER, DRIVER_ASSIGNED, TRIP_STARTED, BOOKING_CANCELLED] }
    NotificationChannel: { type: string, enum: [EMAIL, SMS, PUSH, IN_APP] }
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    Geofence:
      type: object
      required: [isEnabled, radiusMeters]
      properties:
        isEnabled: { type: boolean }
        radiusMeters: { type: number, format: double, minimum: 10, maximum: 5000 }
    EmergencyContact:
      type: object
      required: [name, phone]
      properties:
        name: { type: string }
        phone: { type: string }
    CreatePortalUserRequest:
      type: object
      additionalProperties: false
      required: [name, corporateEmail, roleCode, hasAllPropertyAccess, propertyId, isActive]
      properties:
        name: { type: string }
        corporateEmail: { type: string, format: email, description: 'Stored lower-cased; unique ignoring case.' }
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        hasAllPropertyAccess: { type: boolean }
        propertyId: { type: string, nullable: true, description: 'Required key. null when hasAllPropertyAccess is true, otherwise one uploaded property code.' }
        isActive: { type: boolean }
    PatchPortalUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        corporateEmail: { type: string, format: email }
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        hasAllPropertyAccess: { type: boolean }
        propertyId: { type: string, nullable: true, description: 'Explicit null clears the single property (use with hasAllPropertyAccess=true).' }
        isActive: { type: boolean }
    PortalUserView:
      type: object
      required: [userId, name, corporateEmail, roleCode, hasAllPropertyAccess, isActive, identityProvider, version]
      properties:
        userId: { type: string, example: user_0190a1b2c3d4 }
        name: { type: string }
        corporateEmail: { type: string, format: email }
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        hasAllPropertyAccess: { type: boolean }
        propertyId: { type: string, nullable: true, description: 'Omitted when null.' }
        isActive: { type: boolean }
        identityProvider: { type: string, example: CORPORATE_SSO }
        version: { type: integer, format: int64 }
    CreateDriverRequest:
      type: object
      additionalProperties: false
      required: [name, licenseNumber, licenseExpiryDate, phone, propertyId, status, languages, emergencyContact]
      properties:
        name: { type: string }
        licenseNumber: { type: string, description: 'Unique ignoring case.' }
        licenseExpiryDate: { type: string, format: date, description: 'Calendar date YYYY-MM-DD, not a UTC instant.' }
        phone: { type: string }
        propertyId: { type: string }
        assignedVehicleId: { type: string, nullable: true, description: 'Vehicle ID from the vehicles collection. The vehicle must belong to the driver property and be visible to the caller. Vehicles bound to another driver are rejected. Both binding directions are updated in one transaction. Null means unassigned; omission on PATCH keeps the binding. Changing the driver property requires clearing or replacing an incompatible vehicle binding.' }
        status: { $ref: '#/components/schemas/DriverStatus' }
        languages: { type: array, minItems: 1, items: { type: string }, description: 'Non-blank, no duplicates (case-insensitive).' }
        emergencyContact: { $ref: '#/components/schemas/EmergencyContact' }
    PatchDriverRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        licenseNumber: { type: string }
        licenseExpiryDate: { type: string, format: date }
        phone: { type: string }
        propertyId: { type: string }
        assignedVehicleId: { type: string, nullable: true, description: 'Vehicle ID from the vehicles collection. The vehicle must belong to the driver property and be visible to the caller. Vehicles bound to another driver are rejected. Both binding directions are updated in one transaction. Null means unassigned; omission on PATCH keeps the binding. Changing the driver property requires clearing or replacing an incompatible vehicle binding.' }
        status: { $ref: '#/components/schemas/DriverStatus' }
        languages: { type: array, minItems: 1, items: { type: string }, description: 'Replaces the whole list.' }
        emergencyContact:
          type: object
          additionalProperties: false
          description: Merged field by field.
          properties:
            name: { type: string }
            phone: { type: string }
    DriverRestriction:
      description: Present for INACTIVE (reason "Deactivated by Operations") and SUSPENDED (reason "Suspended by Operations") drivers; omitted for ACTIVE.
      type: object
      properties:
        reason: { type: string, nullable: true }
        effectiveDate: { type: string, format: date, nullable: true }
    DriverView:
      type: object
      required: [driverId, name, licenseNumber, licenseExpiryDate, phone, propertyId, assignedVehicle, status, languages, emergencyContact, version]
      properties:
        driverId: { type: string, example: driver_0190a1b2c3d4 }
        name: { type: string }
        licenseNumber: { type: string }
        licenseExpiryDate: { type: string, format: date }
        phone: { type: string }
        propertyId: { type: string }
        assignedVehicleId: { type: string, nullable: true, description: 'Bound vehicle ID; omitted when unassigned or for legacy text records.' }
        assignedVehicle: { type: string, readOnly: true, description: 'Vehicle label resolved from the bound ID; legacy labels remain readable.' }
        status: { $ref: '#/components/schemas/DriverStatus' }
        languages: { type: array, items: { type: string } }
        emergencyContact: { $ref: '#/components/schemas/EmergencyContact' }
        availability: { allOf: [ { $ref: '#/components/schemas/DriverAvailability' } ], nullable: true, description: 'Read-only; omitted until a trusted synchronisation source exists.' }
        availabilitySource: { type: string, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true, description: ISO 8601 UTC. }
        restriction: { allOf: [ { $ref: '#/components/schemas/DriverRestriction' } ], nullable: true }
        version: { type: integer, format: int64 }
    CreateLocationRequest:
      type: object
      additionalProperties: false
      required: [name, address, coordinates, region, categoryCode, contactPerson, contactPhone, operatingHours, geofence, isActive]
      properties:
        name: { type: string, description: 'Unique ignoring case.' }
        address: { type: string }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        region: { $ref: '#/components/schemas/LocationRegion' }
        categoryCode: { type: string, description: 'Uploaded category code, not the display name.' }
        contactPerson: { type: string }
        contactPhone: { type: string }
        operatingHours: { type: string }
        geofence: { $ref: '#/components/schemas/Geofence' }
        isActive: { type: boolean }
        notes: { type: string, nullable: true }
    PatchLocationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string }
        address: { type: string }
        coordinates:
          type: object
          additionalProperties: false
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
        region: { $ref: '#/components/schemas/LocationRegion' }
        categoryCode: { type: string }
        contactPerson: { type: string }
        contactPhone: { type: string }
        operatingHours: { type: string }
        geofence:
          type: object
          additionalProperties: false
          properties:
            isEnabled: { type: boolean }
            radiusMeters: { type: number, format: double }
        isActive: { type: boolean }
        notes: { type: string, nullable: true, description: 'Explicit null clears the notes.' }
    LocationView:
      type: object
      required: [locationId, name, address, coordinates, region, categoryCode, contactPerson, contactPhone, operatingHours, geofence, isActive, sortOrder, version]
      properties:
        locationId: { type: string, example: location_0190a1b2c3d4 }
        name: { type: string }
        address: { type: string }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        region: { $ref: '#/components/schemas/LocationRegion' }
        categoryCode: { type: string }
        contactPerson: { type: string }
        contactPhone: { type: string }
        operatingHours: { type: string }
        geofence: { $ref: '#/components/schemas/Geofence' }
        isActive: { type: boolean }
        notes: { type: string, nullable: true }
        sortOrder: { type: integer, format: int32, description: 'Position inside the region, from 1.' }
        version: { type: integer, format: int64 }
    LocationOrderingRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [locationId]
            properties:
              locationId: { type: string }
    LocationOrderingView:
      type: object
      required: [region, items]
      properties:
        region: { $ref: '#/components/schemas/LocationRegion' }
        items:
          type: array
          items:
            type: object
            required: [locationId, sortOrder, version]
            properties:
              locationId: { type: string }
              sortOrder: { type: integer, format: int32 }
              version: { type: integer, format: int64 }
    CreateCustomerBlacklistRequest:
      type: object
      additionalProperties: false
      required: [customerName, memberId, reason, effectiveDate, expiryDate, isActive]
      properties:
        customerName: { type: string }
        memberId: { type: string, description: 'Unique ignoring case.' }
        reason: { type: string }
        effectiveDate: { type: string, format: date, description: 'Inclusive.' }
        expiryDate: { type: string, format: date, description: 'Inclusive; not earlier than effectiveDate.' }
        isActive: { type: boolean }
    PatchCustomerBlacklistRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        customerName: { type: string }
        memberId: { type: string }
        reason: { type: string }
        effectiveDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        isActive: { type: boolean }
    CustomerBlacklistView:
      type: object
      required: [blacklistId, customerName, memberId, reason, effectiveDate, expiryDate, isActive, version]
      properties:
        blacklistId: { type: string, example: blacklist_0190a1b2c3d4 }
        customerName: { type: string }
        memberId: { type: string }
        reason: { type: string }
        effectiveDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        isActive: { type: boolean }
        version: { type: integer, format: int64 }
    AuditView:
      type: object
      required: [auditId, actor, operation, resourceType, resourceId, occurredAt, outcome, traceId, sourceService]
      properties:
        auditId: { type: string }
        actor: { type: string }
        operation: { type: string, example: portal-user.update }
        resourceType: { type: string }
        resourceId: { type: string }
        occurredAt: { type: string, format: date-time, description: ISO 8601 UTC. }
        outcome: { type: string, enum: [Succeeded, Failed] }
        traceId: { type: string }
        sourceService: { type: string }
        changeSummary: { type: string, nullable: true, description: 'Field names only, never values.' }
        reasonReference: { type: string, nullable: true }
        propertyId: { type: string, nullable: true }
        device: { type: string, nullable: true, description: 'Not populated until a trusted source exists (Q11).' }
        sourceIp: { type: string, nullable: true, description: 'Not populated until a trusted source exists (Q11).' }
        sessionReference: { type: string, nullable: true, description: 'Not populated until a trusted source exists (Q11).' }
    PropertyView:
      type: object
      required: [propertyId, name, address, contactPerson, contactPhone, assignedFleetCount, operatingHours, serviceLevel, minimumLeadTimeHours, cancellationPolicyReference, membershipEligibility, vipOverrideRule, isActive, isDeleted, version]
      properties:
        propertyId: { type: string }
        name: { type: string }
        address: { type: string }
        contactPerson: { type: string }
        contactPhone: { type: string }
        assignedFleetCount: { type: integer, format: int32, minimum: 0 }
        operatingHours: { type: string }
        serviceLevel: { type: string }
        minimumLeadTimeHours: { type: integer, format: int32, minimum: 0 }
        cancellationPolicyReference: { type: string }
        membershipEligibility: { type: string }
        dailyQuota: { type: integer, format: int32, nullable: true, description: 'From Booking quota; omitted while unavailable.' }
        vipOverrideRule: { type: string }
        isActive: { type: boolean }
        isDeleted: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    CreatePropertyRequest:
      type: object
