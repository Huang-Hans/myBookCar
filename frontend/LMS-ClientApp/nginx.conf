# LMS Client App (uni-app H5): SPA fallback, asset caching, and readiness probe.
# This replaces the default nginx site and listens on the Compose port.
# WebSocket 升级：普通请求 Connection 置空，SignalR 升级请求透传 Upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5192;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API routing avoids browser CORS and keeps gateway details out of the bundle.
    location /api/ {
        proxy_pass https://melco1.weprogram.site;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        # SignalR 的 WebSocket 传输需要升级头透传；普通请求 Connection 置空。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host melco1.weprogram.site;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # The H5 build uses hash routing; unknown paths still fall back to the entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 内部下载列表：不带尾斜杠时先跳转到目录地址。
    location = /downloads {
        return 301 /downloads/;
    }

    location = /downloads/index.html {
        return 301 /downloads/;
    }

    # 直接展示宿主机挂载目录中的安装包。
    location ^~ /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        sub_filter_once on;
        sub_filter '<h1>Index of /downloads/</h1>' '<h1>LMS 安装包</h1><p class="subtitle">内部下载列表</p>';
        sub_filter '<title>Index of /downloads/</title>' '<title>downloads</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;padding:32px;color:#17201e;background:#f6f7f8;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}h1,p,hr{display:none}pre{margin:0;padding:20px;overflow-x:auto;white-space:pre;background:#fff;border:1px solid #dfe3e2;border-radius:6px;font:16px/2 "Cascadia Mono",Consolas,monospace}a{color:#176b5b;text-decoration:none}a:hover{text-decoration:underline}a[href="../"]{display:none}@media(max-width:600px){body{padding:16px}pre{padding:16px;font-size:15px;line-height:2}}</style>';
        types {
            application/vnd.android.package-archive apk;
            text/plain txt md;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff";
    }

    # Keep the entry document fresh while hashed assets remain cacheable.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # The deployment script waits for this readiness probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
