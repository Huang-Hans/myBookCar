plugins {
    id "com.android.application"
}

android {
    namespace "com.melco.lms.user"
    compileSdk 35

    defaultConfig {
        applicationId "com.melco.lms.user"
        minSdk 23
        targetSdk 35
        versionCode 100
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
