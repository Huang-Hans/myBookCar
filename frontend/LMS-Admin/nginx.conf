# LMS Admin Portal: SPA fallback, asset caching, and readiness probe.
# This replaces the default nginx site and listens on the Compose port.
# WebSocket 升级：普通请求 Connection 置空，SignalR 升级请求透传 Upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5188;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API routing avoids browser CORS and keeps gateway details out of the bundle.
    location /api/ {
        proxy_pass https://melco1.weprogram.site;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host melco1.weprogram.site;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Portal routes are handled by the client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep the entry document fresh while hashed assets remain cacheable.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # The deployment script waits for this readiness probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
